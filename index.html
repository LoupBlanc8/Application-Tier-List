<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tier List — Classement Ultime</title>
    <meta name="description" content="Application de Tier List interactive pour noter vos amis sur différentes catégories.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="noise-overlay"></div>
    
    <header class="app-header">
        <div class="header-left">
            <h1 class="logo">TIER<span class="logo-accent">LIST</span></h1>
            <p class="tagline">Classement Ultime</p>
        </div>
        <div class="header-right">
            <button class="btn-add-category" id="btnAddCategory" title="Gérer les catégories">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 5h12M3 9h12M3 13h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M14 12v4M12 14h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                <span>Catégories</span>
            </button>
            <button class="btn-add-person" id="btnAddPerson" title="Ajouter une personne">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <span>Ajouter</span>
            </button>
            <button class="btn-export" id="btnExport" title="Exporter">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 2v10M5 8l4 4 4-4M3 14h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
        </div>
    </header>

    <main class="app-main">
        <!-- View Toggle -->
        <div class="view-controls">
            <button class="view-btn active" data-view="table" id="viewTable">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.2"/><rect x="9" y="1" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.2"/><rect x="1" y="9" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.2"/><rect x="9" y="9" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.2"/></svg>
                Tableau
            </button>
            <button class="view-btn" data-view="cards" id="viewCards">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="2" width="14" height="4" rx="1" stroke="currentColor" stroke-width="1.2"/><rect x="1" y="10" width="14" height="4" rx="1" stroke="currentColor" stroke-width="1.2"/></svg>
                Fiches
            </button>
            <button class="view-btn" data-view="ranking" id="viewRanking">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 14V8M8 14V4M12 14V6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                Classement
            </button>
        </div>

        <!-- TABLE VIEW -->
        <div class="view-container" id="tableView">
            <div class="table-wrapper">
                <table class="tier-table" id="tierTable">
                    <thead>
                        <tr>
                            <th class="sticky-col name-col">NOM</th>
                            <!-- Categories will be injected -->
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Rows will be injected -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- CARDS VIEW -->
        <div class="view-container hidden" id="cardsView">
            <div class="cards-grid" id="cardsGrid">
                <!-- Cards will be injected -->
            </div>
        </div>

        <!-- RANKING VIEW -->
        <div class="view-container hidden" id="rankingView">
            <div class="ranking-container" id="rankingContainer">
                <!-- Ranking will be injected -->
            </div>
        </div>
    </main>

    <!-- Modal for adding/editing person -->
    <div class="modal-overlay hidden" id="modalOverlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Ajouter une personne</h2>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="personName">Nom</label>
                    <input type="text" id="personName" placeholder="Entrer le nom..." autocomplete="off">
                </div>
                <div class="modal-ratings" id="modalRatings">
                    <!-- Rating inputs will be injected -->
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" id="btnCancel">Annuler</button>
                <button class="btn-save" id="btnSave">Sauvegarder</button>
            </div>
        </div>
    </div>

    <!-- Context menu for delete/edit -->
    <div class="context-menu hidden" id="contextMenu">
        <button class="context-item" id="ctxEdit">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M10.5 1.5l2 2-8 8H2.5v-2l8-8z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
            Modifier
        </button>
        <button class="context-item danger" id="ctxDelete">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 4h8M5 4V3a1 1 0 011-1h2a1 1 0 011 1v1M11 4v7a1 1 0 01-1 1H4a1 1 0 01-1-1V4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Supprimer
        </button>
    </div>

    <!-- Modal for managing categories -->
    <div class="modal-overlay hidden" id="catModalOverlay">
        <div class="modal cat-modal">
            <div class="modal-header">
                <h2 class="modal-title">Gérer les catégories</h2>
                <button class="modal-close" id="catModalClose">&times;</button>
            </div>
            <div class="modal-body">
                <div class="cat-add-row">
                    <input type="text" id="newCatInput" placeholder="Nouvelle catégorie..." autocomplete="off">
                    <button class="btn-add-cat" id="btnAddCat">
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 4v10M4 9h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    </button>
                </div>
                <div class="cat-list" id="catList">
                    <!-- Category items injected -->
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-save" id="btnCatDone">Terminé</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
